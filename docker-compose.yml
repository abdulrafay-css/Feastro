version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6
    container_name: feastro_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Express Backend
  backend:
    image: node:18-alpine
    container_name: feastro_backend
    working_dir: /app
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/feastro
      - NODE_ENV=development
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run dev"

volumes:
  mongodb_data: